  function QRPolynomial(num, shift) { if (num.length == undefined) throw new Error(num.length + '/' + shift); var offset = 0; while (offset < num.length && num[offset] === 0) offset++; this.num = new Array(num.length - offset + shift); for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset]; }

    multiply: function(e) {

      for (var i = 0; i < this.getLength(); i++) for (var j = 0; j < e.getLength(); j++) num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));

  function generateQR(url) {
    var container = document.getElementById('qrcode');
    container.innerHTML = '';
    var qr = new QRCodeModel(6, QRCodeModel.ErrorCorrectLevel.M);
    qr.addData(url);
    qr.make();
    var canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    var ctx = canvas.getContext('2d');
    var size = qr.getModuleCount();
    var scale = 256 / size;
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {

    container.appendChild(canvas);

    document.getElementById('url-display').textContent = url;

function copyUrl() {
  var url = document.getElementById('url-display').textContent;
  navigator.clipboard.writeText(url).then(function() {
    var btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy URL'; }, 2000);
  });
}
