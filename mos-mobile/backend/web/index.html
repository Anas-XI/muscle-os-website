<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muscle OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
/* nav */
nav{display:flex;gap:0;border-bottom:1px solid #222;background:#12121a;flex-shrink:0}
nav button{flex:1;padding:14px;background:none;border:none;color:#666;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
nav button:hover{color:#e0e0e0}
nav button.active{color:#3b82f6;border-bottom-color:#3b82f6}
.panel{display:none;flex:1;overflow:hidden}
.panel.active{display:flex;flex-direction:column}
/* auth */
#auth-panel{align-items:center;justify-content:center;gap:16px;padding:40px}
#auth-panel h1{font-size:32px;font-weight:800;color:#fff}
#auth-panel p{color:#666;margin-bottom:16px}
#auth-form{width:360px;display:flex;flex-direction:column;gap:12px}
#auth-form input,#auth-form select{background:#1a1a2a;border:1px solid #333;border-radius:10px;padding:12px 16px;color:#e0e0e0;font-size:14px;outline:none}
#auth-form input:focus{border-color:#3b82f6}
#auth-form button{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
#auth-form button:hover{background:#4a92ff}
#auth-form .toggle{background:none;color:#3b82f6;font-size:13px;border:none;cursor:pointer;padding:4px}
/* chat */
#chat-main{flex:1;display:flex;flex-direction:column}
#chat-header{padding:16px 24px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#chat-header h2{font-size:16px;font-weight:600}
#chat-header span{color:#888;font-size:13px}
#chat-msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:#3b82f6;align-self:flex-end;border-bottom-right-radius:4px;color:#fff}
.msg.assistant{background:#1e1e2a;align-self:flex-start;border-bottom-left-radius:4px}
.msg .time{font-size:11px;color:#888;margin-top:4px;opacity:.7}
.typing{color:#888;font-size:13px;font-style:italic;padding:8px 24px}
#chat-input-area{display:flex;gap:12px;padding:16px 24px;border-top:1px solid #222;background:#0d0d15;flex-shrink:0}
#chat-input{flex:1;background:#1a1a2a;border:1px solid #333;border-radius:10px;padding:12px 16px;color:#e0e0e0;font-size:14px;outline:none;resize:none;max-height:120px;font-family:inherit}
#chat-input:focus{border-color:#3b82f6}
#send-btn{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;font-size:14px;font-weight:500}
#send-btn:hover{background:#4a92ff}
#send-btn:disabled{background:#333;cursor:not-allowed}
/* profile */
#profile-content{padding:24px;overflow-y:auto}
#profile-content .card{background:#1a1a2a;border-radius:12px;padding:20px;margin-bottom:16px}
#profile-content h3{font-size:14px;color:#888;margin-bottom:12px;text-transform:uppercase}
.field-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a2a}
.field-row .label{color:#888;font-size:13px}
.field-row .value{color:#e0e0e0;font-size:13px;font-weight:500}
button.generate{background:#1e3a5f;color:#60a5fa;border:1px solid #3b82f6;border-radius:10px;padding:12px 24px;cursor:pointer;font-size:14px;margin-top:8px}
button.generate:hover{background:#2a4a7f}
</style>
</head>
<body>

<nav id="nav">
  <button class="active" data-tab="auth" id="nav-auth">Sign In</button>
  <button data-tab="chat" id="nav-chat" disabled>Chat</button>
  <button data-tab="profile" id="nav-profile" disabled>Profile</button>
</nav>

<div id="auth-panel" class="panel active">
  <h1>Muscle OS</h1>
  <p>AI-Powered Fitness Coach</p>
  <div id="auth-form">
    <input id="auth-email" placeholder="Email" type="email" />
    <input id="auth-pass" placeholder="Password" type="password" />
    <select id="auth-role">
      <option value="client">Client</option>
      <option value="coach">Coach</option>
    </select>
    <input id="auth-name" placeholder="Name (for signup)" />
    <button id="auth-submit" onclick="handleAuth()">Sign In</button>
    <button class="toggle" onclick="toggleAuth()">Don't have an account? Sign up</button>
    <div id="auth-error" style="color:#ef4444;font-size:13px;text-align:center"></div>
  </div>
</div>

<div id="chat-panel" class="panel">
  <div id="chat-main">
    <div id="chat-header">
      <h2>AI Coach</h2>
      <span id="chat-user-info"></span>
      <button onclick="signOut()" style="background:none;border:none;color:#ef4444;font-size:13px;cursor:pointer">Sign Out</button>
    </div>
    <div id="chat-msgs">
      <div class="msg assistant">Sign in and start chatting with your AI coach.</div>
    </div>
    <div id="typing-indicator" class="typing" style="display:none">Coaching...</div>
    <div id="chat-input-area">
      <textarea id="chat-input" placeholder="Ask your coach..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
    </div>
  </div>
</div>

<div id="profile-panel" class="panel">
  <div id="profile-content">
    <div class="card" id="profile-summary">
      <h3>Profile</h3>
      <div id="profile-fields"></div>
    </div>
    <div class="card">
      <h3>Program</h3>
      <div id="program-content" style="color:#888;font-size:13px">Complete intake to generate a program.</div>
      <button class="generate" onclick="generateProgram()">Generate Program</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000'
let state = { userId: null, email: null, role: null, msgs: [], isSignup: false }

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} }
  if (body) opts.body = JSON.stringify(body)
  const r = await fetch(API + path, opts)
  if (!r.ok) { let e; try { e = await r.json() } catch { e = {detail: r.statusText} }; throw new Error(e.detail || r.statusText) }
  return r.json()
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML }

function showTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'))
  document.getElementById(tab + '-panel').classList.add('active')
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active')
}

function toggleAuth() {
  state.isSignup = !state.isSignup
  document.getElementById('auth-submit').textContent = state.isSignup ? 'Sign Up' : 'Sign In'
  document.getElementById('auth-name').style.display = state.isSignup ? 'block' : 'none'
  document.getElementById('auth-role').style.display = state.isSignup ? 'block' : 'none'
  document.querySelector('.toggle').textContent = state.isSignup ? 'Already have an account? Sign in' : "Don't have an account? Sign up"
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim()
  const pass = document.getElementById('auth-pass').value
  const err = document.getElementById('auth-error')
  err.textContent = ''
  try {
    if (state.isSignup) {
      const name = document.getElementById('auth-name').value.trim() || email.split('@')[0]
      const role = document.getElementById('auth-role').value
      await api('POST', '/api/auth/signup', { email, password: pass, name, role })
    }
    const data = await api('POST', '/api/auth/login', { email, password: pass })
    state.userId = data.user_id; state.email = data.email; state.role = data.role
    afterLogin()
  } catch(e) { err.textContent = e.message }
}

function afterLogin() {
  document.getElementById('nav-chat').disabled = false
  document.getElementById('nav-profile').disabled = false
  document.getElementById('nav-auth').textContent = state.email
  document.getElementById('chat-user-info').textContent = state.email
  document.getElementById('send-btn').disabled = false
  document.getElementById('chat-input').disabled = false
  showTab('chat')
  addMsg('assistant', `Signed in as ${state.email}. Ask me anything about your training!`)
  loadProfile()
}

function signOut() {
  state = { userId: null, email: null, role: null, msgs: [], isSignup: false }
  document.getElementById('nav-chat').disabled = true
  document.getElementById('nav-profile').disabled = true
  document.getElementById('nav-auth').textContent = 'Sign In'
  document.getElementById('send-btn').disabled = true
  document.getElementById('chat-input').disabled = true
  document.getElementById('chat-msgs').innerHTML = '<div class="msg assistant">Signed out.</div>'
  showTab('auth')
}

function addMsg(role, text) {
  state.msgs.push({ role, text, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) })
  const el = document.getElementById('chat-msgs')
  el.innerHTML = state.msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}<div class="time">${m.time}</div></div>`).join('')
  el.scrollTop = el.scrollHeight
}

async function sendMsg() {
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text || !state.userId) return
  input.value = ''
  addMsg('user', text)
  const btn = document.getElementById('send-btn')
  const typing = document.getElementById('typing-indicator')
  btn.disabled = true; typing.style.display = 'block'

  try {
    const r = await fetch(API + '/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: state.userId, message: text }),
    })
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let full = ''
    state.msgs.push({ role: 'assistant', text: '', time: '' })
    const idx = state.msgs.length - 1
    let buffer = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buffer += decoder.decode(value, { stream: true })
      const lines = buffer.split('\n')
      buffer = lines.pop() || ''
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6)
          if (data === '[DONE]') continue
          full += data
          state.msgs[idx] = { role: 'assistant', text: full, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }
          const el = document.getElementById('chat-msgs')
          el.innerHTML = state.msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}<div class="time">${m.time}</div></div>`).join('')
          el.scrollTop = el.scrollHeight
        }
      }
    }
  } catch(e) {
    addMsg('assistant', `Error: ${e.message}`)
  }
  btn.disabled = false; typing.style.display = 'none'
}

async function loadProfile() {
  if (!state.userId) return
  try {
    const p = await api('GET', '/api/profile/' + state.userId)
    const el = document.getElementById('profile-fields')
    const fields = [
      ['Goal', p.goal], ['Experience', p.experience],
      ['Weight', p.weight ? p.weight + ' kg' : null],
      ['Height', p.height ? p.height + ' cm' : null],
      ['Age', p.age],
      ['Training Days', p.training_days],
      ['Sleep', p.sleep], ['Stress', p.stress],
    ].filter(f => f[1])
    el.innerHTML = fields.map(f => `<div class="field-row"><span class="label">${f[0]}</span><span class="value">${esc(String(f[1]))}</span></div>`).join('')
    if (fields.length === 0) el.innerHTML = '<div style="color:#888;font-size:13px">Complete onboarding to set up your profile.</div>'
  } catch(e) {
    document.getElementById('profile-fields').innerHTML = '<div style="color:#888;font-size:13px">Complete onboarding to set up your profile.</div>'
  }
}

async function generateProgram() {
  if (!state.userId) return
  const btn = event.target; btn.disabled = true; btn.textContent = 'Generating...'
  try {
    await api('POST', '/api/generate-program', { user_id: state.userId })
    addMsg('assistant', 'Program generated! Check the Profile tab.')
    loadProfile()
  } catch(e) { addMsg('assistant', 'Generation failed: ' + e.message) }
  btn.disabled = false; btn.textContent = 'Generate Program'
}
</script>
</body>
</html>
