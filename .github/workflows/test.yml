name: test

on:
  push:
    branches: ["master"]
    paths:
      - "mos_bot/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "mos_bot/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/ -v --tb=short
