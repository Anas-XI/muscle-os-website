<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Muscle OS Combined App — training (MOS-HYPERKINETIX) and nutrition (MOS-METABOLIX) together in one unified interface.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://accounts.google.com; frame-src 'self' https://accounts.google.com/gsi/ https://accounts.google.com; connect-src 'self' https://muscleos-access-control.muscleos.workers.dev https://accounts.google.com/gsi/ https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<title>Muscle OS — Combined App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #0D0E12; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0D0E12;
    color: #FAFAF8;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  body[dir="rtl"] .hub-brand, body[dir="rtl"] .tab-label { letter-spacing: 0; }
  .hub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(13, 14, 18, 0.98);
    border-bottom: 1px solid rgba(244, 201, 59, 0.15);
    z-index: 200;
  }
  .hub-brand {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.85rem;
    color: #FAFAF8;
    line-height: 1.2;
  }
  .hub-brand b { color: #F4C93B; }
  .hub-brand small {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: rgba(250, 250, 248, 0.45);
    text-transform: none;
  }
  .hub-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status-chip {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 46vw;
  }
  .status-chip.ok { background: rgba(76, 175, 80, 0.15); color: #4CAF50; border: 1px solid rgba(76, 175, 80, 0.35); }
  .status-chip.trial { background: rgba(244, 201, 59, 0.13); color: #F4C93B; border: 1px solid rgba(244, 201, 59, 0.3); }
  .status-chip.locked { background: rgba(250, 250, 248, 0.06); color: rgba(250, 250, 248, 0.55); border: 1px solid rgba(250, 250, 248, 0.12); }
  .hub-cta {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    background: #F4C93B;
    color: #0D0E12;
    text-decoration: none;
    white-space: nowrap;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .hub-cta:active { transform: scale(0.96); }
  .app-container {
    flex: 1;
    position: relative;
    width: 100%;
    overflow: hidden;
  }
  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  iframe.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }
  .tab-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(20, 21, 26, 0.98);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(244, 201, 59, 0.15);
    padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 100;
  }
  .tab-item {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    cursor: pointer;
    color: rgba(250, 250, 248, 0.4);
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .tab-item:active { transform: scale(0.95); }
  .tab-icon { font-size: 1.4rem; filter: grayscale(100%) opacity(0.6); transition: all 0.2s ease; }
  .tab-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .tab-item.active { color: #F4C93B; }
  .tab-item.active .tab-icon { filter: none; transform: translateY(-2px); }

  .dashboard-view {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    overflow-y: auto; padding: 20px 14px; z-index: 10;
  }
  .dashboard-view.active {
    opacity: 1; pointer-events: auto; z-index: 20;
  }
  .dash-content { max-width: 600px; margin: 0 auto; }
  .dash-title {
    font-family: 'Oswald', sans-serif; font-size: 1.4rem; color: #F4C93B;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
  }
  .synergy-card {
    background: rgba(26, 27, 38, 0.85); border: 1px solid rgba(244, 201, 59, 0.18);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .sync-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: uppercase;
    color: rgba(250, 250, 248, 0.6);
  }
  .sync-header .icon { font-size: 1.2rem; }
  .synergy-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; color: #FAFAF8; }
  .synergy-sub { font-size: 0.75rem; color: rgba(250, 250, 248, 0.4); margin-top: 2px; }
  
  .insight-card {
    background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3);
    border-radius: 10px; padding: 12px; margin-bottom: 10px;
  }
  .insight-card.warn {
    background: rgba(244, 201, 59, 0.1); border-color: rgba(244, 201, 59, 0.3); color: #F4C93B;
  }
  .insight-card.warn .insight-title { color: #F4C93B; }
  .insight-card.danger {
    background: rgba(244, 67, 54, 0.1); border-color: rgba(244, 67, 54, 0.3); color: #f44336;
  }
  .insight-card.danger .insight-title { color: #f44336; }
  .insight-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #4CAF50; }
  .insight-desc { font-size: 0.75rem; color: rgba(250, 250, 248, 0.8); line-height: 1.4; }
  
  .toast-container {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast {
    background: rgba(20, 21, 26, 0.95); border: 1px solid #F4C93B; border-radius: 8px;
    padding: 12px 16px; color: #FAFAF8; font-size: 0.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

  <header class="hub-header">
    <div class="hub-brand">
      <b>MOS</b> COMBINED
      <small data-i18n="hub_sub">Training + Nutrition, one app</small>
    </div>
    <div class="hub-side">
      <button id="hubAccountBtn" onclick="document.getElementById('hubPaywallOverlay').style.display='flex'" style="background:rgba(244,201,59,0.12); color:#F4C93B; border:1px solid rgba(244,201,59,0.3); border-radius:999px; font-size:0.68rem; font-weight:600; padding:5px 10px; cursor:pointer;">👤 Account</button>
      <span class="status-chip locked" id="statusChip" data-i18n="hub_locked">Locked</span>
      <a class="hub-cta" href="../order.html?product=omni_hub" data-i18n="hub_cta">Get Access</a>
    </div>
  </header>

  <div class="app-container">
    <iframe id="frame-training" class="active" src="training_tool.html" title="Training"></iframe>
    <iframe id="frame-nutrition" data-src="tdee_adaptive_engine.html" title="Nutrition"></iframe>
  </div>

  <nav class="tab-bar">
    <div class="tab-item active" data-target="frame-training">
      <span class="tab-icon">&#127993;</span>
      <span class="tab-label" data-i18n="hub_tab_training">Training</span>
    </div>
    <div class="tab-item" data-target="frame-nutrition">
      <span class="tab-icon">&#129382;</span>
      <span class="tab-label" data-i18n="hub_tab_nutrition">Nutrition</span>
    </div>
  </nav>

  <script>
  (function(){
    var I18N = {
      en: {
        hub_sub: 'Training + Nutrition, one app',
        hub_locked: 'Locked',
        hub_trial: 'Trial active',
        hub_ok: 'Access active',
        hub_cta: 'Get Access',
        hub_tab_training: 'Training',
        hub_tab_nutrition: 'Nutrition'
      },
      ar: {
        hub_sub: '\u0627\u0644\u062A\u062F\u0631\u064A\u0628 + \u0627\u0644\u062A\u063A\u0630\u064A\u0629 \u0641\u064A \u062A\u0637\u0628\u064A\u0642 \u0648\u0627\u062D\u062F',
        hub_locked: '\u0645\u0642\u0641\u0644',
        hub_trial: '\u0627\u0644\u062A\u062C\u0631\u0628\u0629 \u0645\u0641\u0639\u0644\u0629',
        hub_ok: '\u0627\u0644\u0648\u0635\u0648\u0644 \u0645\u0641\u0639\u0644',
        hub_cta: '\u0627\u0634\u062A\u0631\u064D \u0627\u0644\u0648\u0635\u0648\u0644',
        hub_tab_training: '\u0627\u0644\u062A\u062F\u0631\u064A\u0628',
        hub_tab_nutrition: '\u0627\u0644\u062A\u063A\u0630\u064A\u0629'
      }
    };
    var TRIAL_DAYS = 7;
    var HUB_PRODUCT = 'omni_hub';
    var HUB_TAB_KEY = 'mos_hub_tab';
    // Mark this session as hub mode BEFORE the tool iframes load, so their auth gates
    // know to require an OMNI HUB product, not the individual tool product.
    try { sessionStorage.setItem('mos_hub_mode', '1'); } catch(e){}
    function deriveProd(code, plan){
      var p = (code || '').toUpperCase();
      if (plan === 'master') return 'all_access';
      if (p.indexOf('OH-') === 0) return 'omni_hub';
      if (p.indexOf('TR-') === 0) return 'training_tool';
      if (p.indexOf('MA-') === 0) return 'all_access';
      if (p.indexOf('TD-') === 0) return 'tdee_adaptive_engine';
      if (p.indexOf('TB-') === 0) return 'both_tools';
      return 'all_access';
    }
    var lang = localStorage.getItem('mos_lang') === 'ar' ? 'ar' : 'en';
    var t = function(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; };
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });

    var TRIAL_MS = TRIAL_DAYS * 24 * 60 * 60 * 1000;
    function refreshStatus(){
      var chip = document.getElementById('statusChip');
      var OWNER_EMAILS = ['ANASSTEM2025@GMAIL.COM', '1022066.ANAS@STEMEGYPT.EDU.EG', 'ANASSMOMEN@GMAIL.COM'];
      var gs = null;
      try { gs = JSON.parse(localStorage.getItem('mos_google_session') || 'null'); } catch(e){}
      var isOwner = gs && gs.email && OWNER_EMAILS.includes(gs.email.toUpperCase());

      var sub = null;
      try { sub = JSON.parse(localStorage.getItem('mos_subscription') || 'null'); } catch(e){}
      var subProd = sub ? (sub.prodId || deriveProd(sub.code, sub.plan)) : null;
      var prodOk = !!sub && (sub.plan === 'master' || sub.code === 'OWNER' || subProd === HUB_PRODUCT || subProd === 'all_access');
      var activeSub = isOwner || !!(sub && sub.active && prodOk && sub.expiry && new Date(sub.expiry + 'T23:59:59') > new Date());
      
      var TRIAL_EPOCH = new Date('2026-08-27T00:00:00.000Z').getTime();
      var trialStart = localStorage.getItem('mos_trial_start');
      if ((!trialStart || new Date(trialStart).getTime() < TRIAL_EPOCH) && !activeSub) {
        trialStart = new Date().toISOString();
        localStorage.setItem('mos_trial_start', trialStart);
        localStorage.setItem('mos_tdee_trial_start', trialStart);
      }
      var trialActive = !!(trialStart && (Date.now() - new Date(trialStart).getTime()) < TRIAL_MS);
      if (activeSub) {
        chip.textContent = isOwner ? 'VIP OWNER' : t('hub_ok');
        chip.className = 'status-chip ok';
      } else if (trialActive) {
        var left = Math.max(1, Math.ceil((new Date(trialStart).getTime() + TRIAL_MS - Date.now()) / 864e5));
        chip.textContent = t('hub_trial') + ' · ' + left + 'd';
        chip.className = 'status-chip trial';
      } else {
        chip.textContent = t('hub_locked');
        chip.className = 'status-chip locked';
      }
    }

    var frames = document.querySelectorAll('iframe, .dashboard-view');
    var tabs = document.querySelectorAll('.tab-item');
    function activate(targetId){
      tabs.forEach(function(tb){ tb.classList.toggle('active', tb.getAttribute('data-target') === targetId); });
      frames.forEach(function(f){
        var on = f.id === targetId;
        f.classList.toggle('active', on);
        if (on) {
          try { sessionStorage.setItem(HUB_TAB_KEY, f.id); } catch(e){}
          var src = f.getAttribute('data-src');
          if (src && !f.getAttribute('src')) { f.setAttribute('src', src); }
        }
      });
    }
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        activate(tab.getAttribute('data-target'));
      });
    });
    var saved = null;
    try { saved = sessionStorage.getItem(HUB_TAB_KEY); } catch(e){}
    activate(saved || 'frame-training');
    refreshStatus();
    window.addEventListener('storage', function(e){
      if (e.key === 'mos_subscription' || e.key === 'mos_trial_start') refreshStatus();
    });

    // Synergy Message Bus
    var omniState = {
      training: { active: false, sessionName: '', fatigue: 'green', acwr: 1.0, isDeload: false },
      nutrition: { cals: 0, macros: {p:0, f:0, c:0}, goal: '' }
    };

    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      
      if (e.data.type === 'OMNI_SYNC_T') {
        omniState.training = e.data.payload;
        updateOmniDashboard();
        broadcastStateToChildren();
      } else if (e.data.type === 'OMNI_SYNC_N') {
        omniState.nutrition = e.data.payload;
        updateOmniDashboard();
      } else if (e.data.type === 'SESSION_STARTED') {
        showToast("🏃‍♂️ Session Started! Pre-workout fuel suggested: 30g Carbs, 15g Protein.");
      } else if (e.data.type === 'SESSION_ENDED') {
        showToast("✅ Session Complete! Post-workout recovery: 40g Protein, 50g Carbs.");
      }
    });

    function broadcastStateToChildren() {
      var nutFrame = document.getElementById('frame-nutrition').contentWindow;
      if(nutFrame) nutFrame.postMessage({ type: 'OMNI_STATE_UPDATE', payload: omniState }, '*');
    }

    function updateOmniDashboard() {
      var tCard = document.getElementById('hub-train-state');
      if (!tCard) return;
      var nCard = document.getElementById('hub-nutr-state');
      var ins = document.getElementById('hub-insights');
      
      if(omniState.training.sessionName) {
        tCard.innerHTML = '<div class="synergy-val">' + omniState.training.sessionName + '</div>' +
                          '<div class="synergy-sub">Fatigue: ' + (omniState.training.fatigue || 'green').toUpperCase() + ' | ACWR: ' + (omniState.training.acwr || 1.0) + '</div>';
      } else {
        tCard.innerHTML = '<div class="synergy-val">Rest Day</div><div class="synergy-sub">No session planned</div>';
      }
      
      if(omniState.nutrition.cals > 0) {
        var m = omniState.nutrition.macros;
        nCard.innerHTML = '<div class="synergy-val">' + omniState.nutrition.cals + ' kcal</div>' +
                          '<div class="synergy-sub">P: ' + m.p + 'g | F: ' + m.f + 'g | C: ' + m.c + 'g</div>';
      }
      
      var insightsHTML = '';
      if(omniState.training.isDeload) {
        insightsHTML += '<div class="insight-card"><div class="insight-title">Deload Week</div><div class="insight-desc">You are in a training deload. We recommend eating at maintenance to shed systemic fatigue.</div></div>';
      }
      if(omniState.training.fatigue === 'red') {
        insightsHTML += '<div class="insight-card danger"><div class="insight-title">High Fatigue Detected</div><div class="insight-desc">Your training pain/fatigue is very high. Consider an extra rest day and slightly higher carbs for recovery.</div></div>';
      } else if(omniState.training.fatigue === 'yellow') {
        insightsHTML += '<div class="insight-card warn"><div class="insight-title">Elevated Fatigue</div><div class="insight-desc">Keep an eye on recovery. Ensure your post-workout protein hits 40g today.</div></div>';
      }
      
      ins.innerHTML = insightsHTML;
    }

    function showToast(msg) {
      var tc = document.getElementById('toast-container');
      if(!tc) {
        tc = document.createElement('div');
        tc.id = 'toast-container';
        tc.className = 'toast-container';
        document.body.appendChild(tc);
      }
      var t = document.createElement('div');
      t.className = 'toast';
      t.innerText = msg;
      tc.appendChild(t);
      setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); },300); }, 4000);
    }
  })();
  </script>

  <!-- OMNI HUB PAYWALL OVERLAY -->
  <div id="hubPaywallOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(13,14,18,0.96); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:20px;">
    <div style="background:#14151A; border:1px solid #2C2E37; border-radius:16px; padding:36px 28px; max-width:400px; width:100%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.5); position:relative;">
      <button data-hub-close="1" onclick="document.getElementById('hubPaywallOverlay').style.display='none'" style="position:absolute; top:12px; right:14px; background:none; border:none; color:rgba(250,250,248,0.5); font-size:1.2rem; cursor:pointer; line-height:1;" title="Close">✕</button>
      <div style="font-size:40px; margin-bottom:12px;">🔒</div>
      <div style="font-family:'Oswald',sans-serif; font-size:1.4rem; font-weight:700; color:#FAFAF8; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">FREE TRIAL ENDED</div>
      <p style="font-size:0.85rem; color:rgba(250,250,248,0.6); margin-bottom:24px; line-height:1.5;">Your 7-day free trial has expired. Enter your access code or sign in with your Google account to continue.</p>
      <a href="../portal.html" style="display:block; width:100%; padding:14px; background:#F4C93B; color:#0D0E12; border-radius:8px; font-weight:700; font-size:0.9rem; text-decoration:none; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px; transition:transform 0.2s;">Unlock via Portal &rarr;</a>
      <a href="../order.html?product=omni_hub" style="display:inline-block; font-size:0.8rem; color:rgba(250,250,248,0.5); text-decoration:underline;">Get Access Code</a>
    </div>
  </div>

  <script>
  (function(){
    var TRIAL_DAYS = 7;
    var TRIAL_MS = TRIAL_DAYS * 24 * 60 * 60 * 1000;
    var HUB_PRODUCT = 'omni_hub';
    function deriveProd(code, plan){
      var p = (code || '').toUpperCase();
      if (plan === 'master') return 'all_access';
      if (p.indexOf('OH-') === 0) return 'omni_hub';
      if (p.indexOf('TR-') === 0) return 'training_tool';
      if (p.indexOf('MA-') === 0) return 'all_access';
      if (p.indexOf('TD-') === 0) return 'tdee_adaptive_engine';
      return 'training_tool';
    }
    function checkPaywall() {
      var sub = null;
      try { sub = JSON.parse(localStorage.getItem('mos_subscription') || 'null'); } catch(e){}
      var subProd = sub ? (sub.prodId || deriveProd(sub.code, sub.plan)) : null;
      var prodOk = !!sub && (sub.plan === 'master' || sub.code === 'OWNER' || subProd === HUB_PRODUCT || subProd === 'all_access');
      var activeSub = !!(sub && sub.active && prodOk && sub.expiry && new Date(sub.expiry + 'T23:59:59') > new Date());
      var trialStart = localStorage.getItem('mos_trial_start');
      var trialActive = !!(trialStart && (Date.now() - new Date(trialStart).getTime()) < TRIAL_MS);

      var ov = document.getElementById('hubPaywallOverlay');
      if (!activeSub && !trialActive) {
        if (ov) ov.style.display = 'flex';
      } else {
        if (ov) ov.style.display = 'none';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', checkPaywall);
    } else {
      checkPaywall();
    }

    window.addEventListener('storage', function(e){
      if (e.key === 'mos_subscription' || e.key === 'mos_trial_start') {
        checkPaywall();
      }
    });
  })();
  </script>
</body>
</html>
