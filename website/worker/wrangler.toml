name = "muscleos-access-control"
main = "src/index.js"
compatibility_date = "2025-07-26"

# ── Default = Production (no custom route until muscleos.coach zone is added) ──
[[kv_namespaces]]
binding = "ACCESS_CODES"
id = "94aabfeb105f4d95969c8f3f91f36649"

# ── Staging (workers.dev) ──
[env.staging]
[[env.staging.kv_namespaces]]
binding = "ACCESS_CODES"
id = "1961751e32b94ca288f046c696b0fb51"

# ── Production (custom domain) ──
[env.production]
route = { pattern = "api.muscleos.coach/*", zone_name = "muscleos.coach" }
[[env.production.kv_namespaces]]
binding = "ACCESS_CODES"
id = "94aabfeb105f4d95969c8f3f91f36649"
