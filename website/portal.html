<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://accounts.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://accounts.google.com https://www.gstatic.com https://ssl.gstatic.com; frame-src 'self' https://accounts.google.com/gsi/ https://accounts.google.com; connect-src 'self' https://muscleos-access-control.muscleos.workers.dev https://accounts.google.com/gsi/ https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'">
  <title>Muscle OS &mdash; Client Portal &amp; Access Unlock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <style>
    :root {
      --bg: #0A0B0E;
      --surface: #14151A;
      --surface-2: #1E2027;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #F4C93B;
      --text: #FAFAF8;
      --text-muted: rgba(250, 250, 248, 0.65);
      --yellow: #F4C93B;
      --yellow-glow: rgba(244, 201, 59, 0.35);
      --red: #ff5252;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 20%, #201b0c 0%, #0A0B0E 65%);
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
    }
    .portal-container {
      width: 100%;
      max-width: 440px;
      padding: 38px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
    }
    .brand {
      font-family: 'Oswald', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .brand span { color: var(--yellow); text-shadow: 0 0 12px var(--yellow-glow); }
    .subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(244, 201, 59, 0.2);
    }
    .btn-unlock {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--yellow), #ffd659);
      color: #0A0B0E;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--yellow-glow);
    }
    .btn-unlock:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,255,255,0.4); }
    .btn-unlock:active { transform: scale(0.98); }
    .btn-unlock:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.25);
      padding: 8px 12px;
      border-radius: 6px;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease; }

    .get-access {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.88rem;
      color: var(--yellow);
      font-weight: 600;
      text-decoration: underline;
    }
    .get-access:hover { color: #fff; }
    
    .trust-badges {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="portal-container" id="portalCard">
    <div class="brand">MUSCLE<span>OS</span></div>
    <div class="subtitle">Client portal and pro suite activation.</div>
    
    <div id="googleSignInBtn" style="display:flex; justify-content:center; margin-bottom: 12px; min-height: 44px;"></div>
    
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; font-size:0.82rem; color:var(--text-muted); cursor:pointer;">
      <input type="checkbox" id="staySignedIn" checked style="accent-color:var(--yellow); width:15px; height:15px; cursor:pointer;">
      <label for="staySignedIn" style="cursor:pointer; margin:0; text-transform:none; font-weight:400;">Keep me signed in</label>
    </div>

    <div style="display:flex; align-items:center; text-align:center; color:var(--text-muted); font-size:11px; margin-bottom: 22px; text-transform:uppercase; letter-spacing:1px;">
      <span style="flex:1; border-bottom:1px solid var(--border); margin-right:12px;"></span>
      OR UNLOCK WITH ACCESS CODE
      <span style="flex:1; border-bottom:1px solid var(--border); margin-left:12px;"></span>
    </div>

    <div class="input-group">
      <label for="accessCode">Pro Access Code</label>
      <input type="text" id="accessCode" placeholder="OH-XXXX-XXXX" autocomplete="off">
    </div>
    
    <button id="unlockBtn" class="btn-unlock">UNLOCK SUITE ACCESS</button>
    <div id="errorMsg" class="error-msg">Invalid access code. Please check and try again.</div>

    <div style="margin-top: 18px;">
      <a href="tools/" style="font-size: 13px; color: var(--text-muted); text-decoration: underline;">Explore Free Calculators &rarr;</a>
    </div>

    <a href="order.html" class="get-access">Need a code? Order access here</a>
    
    <div class="trust-badges">
      <span>🔒 Encrypted Access</span>
      <span>•</span>
      <span>⚡ Instant Sync</span>
      <span>•</span>
      <span>📱 PWA Ready</span>
    </div>

    <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.76rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--text-muted); margin: 0 6px;">Home</a> &middot;
      <a href="privacy.html" style="color: var(--text-muted); margin: 0 6px;">Privacy</a> &middot;
      <a href="terms.html" style="color: var(--text-muted); margin: 0 6px;">Terms</a> &middot;
      <a href="refund.html" style="color: var(--text-muted); margin: 0 6px;">Refunds</a>
    </div>
  </div>

  <script>
    (function(){
      var SUB_KEY = 'mos_subscription';
      var API = 'https://muscleos-access-control.muscleos.workers.dev/api/verify-code';
      
      var btn = document.getElementById('unlockBtn');
      var input = document.getElementById('accessCode');
      var err = document.getElementById('errorMsg');
      var portalCard = document.getElementById('portalCard');
      var staySignedInEl = document.getElementById('staySignedIn');

      var ERR_MSGS = {
        invalid_code: 'Wrong code. Please check your order confirmation.',
        wrong_product: 'This code belongs to a different Muscle OS tool.',
        code_used_by_other: 'This code is already linked to another account.',
        code_exhausted: 'This code has reached maximum activations.',
        code_revoked: 'This access code has been revoked.',
        code_expired: 'This access code has expired.',
        network: 'Network connection issue. Please retry.'
      };

      function routeProduct(productId) {
        if (productId === 'omni_hub' || productId === 'all_access') {
          window.location.href = 'tools/muscle_os_app.html';
        } else if (productId === 'training_tool') {
          window.location.href = 'tools/training_tool.html';
        } else if (productId === 'tdee_adaptive_engine') {
          window.location.href = 'tools/tdee_adaptive_engine.html';
        } else {
          window.location.href = 'tools/';
        }
      }

      function storeData(key, value) {
        var stay = staySignedInEl ? staySignedInEl.checked : true;
        if (stay) {
          localStorage.setItem(key, value);
        } else {
          sessionStorage.setItem(key, value);
          localStorage.removeItem(key);
        }
      }

      function showError(msg) {
        err.style.display = 'block';
        err.textContent = msg;
        portalCard.classList.remove('shake');
        void portalCard.offsetWidth; // trigger reflow
        portalCard.classList.add('shake');
      }

      function attemptVerify(code) {
        btn.disabled = true;
        btn.textContent = 'Verifying Code...';
        err.style.display = 'none';

        fetch(API, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ code: code, productId: 'any' }) 
        })
        .then(function(r){ return r.json().catch(function(){ return null; }).then(function(d){ return { ok: r.ok, d: d }; }); })
        .then(function(res){
          if (res.ok && res.d && res.d.valid) {
            var actualProdId = res.d.productId || 'all_access';
            storeData(SUB_KEY, JSON.stringify({ 
              active: true, 
              plan: res.d.plan || 'pro_tool', 
              expiry: (res.d.expiresAt || '').slice(0, 10), 
              token: res.d.token || '', 
              code: code, 
              email: '', 
              prodId: actualProdId 
            }));
            routeProduct(actualProdId);
          } else {
            btn.disabled = false;
            btn.textContent = 'UNLOCK SUITE ACCESS';
            if (res.d && res.d.error) {
              showError(ERR_MSGS[res.d.error] || ERR_MSGS.invalid_code);
            } else {
              showError(ERR_MSGS.network);
            }
          }
        })
        .catch(function(){ 
          btn.disabled = false;
          btn.textContent = 'UNLOCK SUITE ACCESS';
          showError(ERR_MSGS.network);
        });
      }

      btn.addEventListener('click', function(){
        var code = (input.value || '').trim();
        if(code) attemptVerify(code);
      });
      
      input.addEventListener('keypress', function(e){
        if(e.key === 'Enter') {
          var code = (input.value || '').trim();
          if(code) attemptVerify(code);
        }
      });

      // Google Sign-In Integration
      var GOOGLE_CLIENT_ID = '335156097845-vq52ttt74pak112mn2eet5j3s1k15fn9.apps.googleusercontent.com';
      var API_BASE = 'https://muscleos-access-control.muscleos.workers.dev';

      function initGsi(){
        var host = document.getElementById('googleSignInBtn');
        if(!host) return;

        if(typeof google === 'undefined' || !google.accounts || !google.accounts.id){
          setTimeout(initGsi, 200);
          return;
        }

        if(host.getAttribute('data-gsi')) return;
        host.setAttribute('data-gsi', '1');

        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: function(resp){
            if(!resp || !resp.credential){
              showError('Google sign-in was cancelled or failed.');
              return;
            }
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            fetch(API_BASE + '/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: resp.credential })
            }).then(function(r){ return r.json(); }).then(function(data){
              btn.disabled = false;
              btn.textContent = 'UNLOCK SUITE ACCESS';
              if(data && data.valid){
                storeData('mos_google_session', JSON.stringify({ session: data.session, email: data.email, name: data.name || '', ts: Date.now() }));
                var OWNER_EMAILS = ['ANASSTEM2025@GMAIL.COM', '1022066.ANAS@STEMEGYPT.EDU.EG', 'ANASSMOMEN@GMAIL.COM'];
                if(OWNER_EMAILS.includes(data.email.toUpperCase())){
                  storeData(SUB_KEY, JSON.stringify({
                    active: true, plan: 'master', expiry: '2099-12-31', code: 'OWNER', email: data.email, prodId: 'all_access', lifetime: true
                  }));
                  storeData('mos_book_training', JSON.stringify({ active: true, code: 'OWNER', book: 'training', expiry: '2099-12-31' }));
                  storeData('mos_book_nutrition', JSON.stringify({ active: true, code: 'OWNER', book: 'nutrition', expiry: '2099-12-31' }));
                  window.location.href = 'tools/muscle_os_app.html';
                  return;
                }
                if(data.subscriptions && data.subscriptions.length > 0){
                  var sub = data.subscriptions[0];
                  var prod = Array.isArray(sub.products) ? sub.products[0] : (sub.products || 'all_access');
                  storeData(SUB_KEY, JSON.stringify({
                    active: true, plan: sub.plan || 'pro_tool', expiry: (sub.expiresAt || '').slice(0, 10), code: sub.code || '', email: data.email, prodId: prod
                  }));
                  routeProduct(prod);
                  return;
                }
                window.location.href = 'tools/muscle_os_app.html';
              } else {
                showError('Google authentication failed. Please try again.');
              }
            }).catch(function(){
              btn.disabled = false;
              btn.textContent = 'UNLOCK SUITE ACCESS';
              showError('Network error during Google sign-in.');
            });
          }
        });
        
        google.accounts.id.renderButton(host, { 
          theme: 'filled_black', 
          size: 'large', 
          width: 320,
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left'
        });
      }

      initGsi();
    })();
  </script>
</body>
</html>
