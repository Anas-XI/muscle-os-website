<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://accounts.google.com; frame-src 'self' https://accounts.google.com/gsi/ https://accounts.google.com; connect-src 'self' https://muscleos-access-control.muscleos.workers.dev https://accounts.google.com/gsi/ https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'">
  <title>Muscle OS - Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <style>
    :root {
      --bg: #0D0E12;
      --surface: #14151A;
      --border: #2C2E37;
      --text: #FAFAF8;
      --text-muted: rgba(250, 250, 248, 0.6);
      --accent: #E11D2E;
      --accent-hover: #b91523;
      --gold: #F4C93B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .portal-container {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      text-align: center;
    }
    .brand {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .brand span { color: var(--gold); }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(244, 201, 59, 0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: #ff4b4b;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }
    .get-access {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: underline;
    }
    .get-access:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="brand">MUSCLE<span>OS</span></div>
    <div class="subtitle">Access your specialized fitness tools.</div>
    
    <div id="googleSignInBtn" style="display:flex; justify-content:center; margin-bottom: 8px; min-height: 44px;"></div>
    
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:18px; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
      <input type="checkbox" id="staySignedIn" checked style="accent-color:var(--gold); width:15px; height:15px; cursor:pointer;">
      <label for="staySignedIn" style="cursor:pointer; margin:0; text-transform:none; font-weight:400; font-size:0.8rem; color:inherit;">Stay signed in</label>
    </div>

    <div style="display:flex; align-items:center; text-align:center; color:var(--text-muted); font-size:11px; margin-bottom: 20px; text-transform:uppercase; letter-spacing:1px;">
      <span style="flex:1; border-bottom:1px solid var(--border); margin-right:12px;"></span>
      OR ENTER ACCESS CODE
      <span style="flex:1; border-bottom:1px solid var(--border); margin-left:12px;"></span>
    </div>

    <div class="input-group">
      <label for="accessCode">Access Code</label>
      <input type="text" id="accessCode" placeholder="Enter your code (e.g. OH-...)" autocomplete="off">
    </div>
    
    <button id="unlockBtn">UNLOCK ACCESS</button>
    <div id="errorMsg" class="error-msg">Invalid code. Please try again.</div>

    <div style="margin-top: 16px;">
      <a href="tools/muscle_os_app.html" style="display:block; padding:12px; border-radius:8px; border:1px solid rgba(244,201,59,0.3); background:rgba(244,201,59,0.08); color:#F4C93B; font-weight:700; font-size:0.85rem; text-decoration:none; text-transform:uppercase; letter-spacing:0.5px; transition:all 0.2s;">Start 7-Day Free Trial &rarr;</a>
    </div>

    <a href="order.html" class="get-access">No code? Get access here</a>
    
    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--text-muted); margin: 0 8px;">Home</a> &middot;
      <a href="privacy.html" style="color: var(--text-muted); margin: 0 8px;">Privacy Policy</a> &middot;
      <a href="terms.html" style="color: var(--text-muted); margin: 0 8px;">Terms</a> &middot;
      <a href="refund.html" style="color: var(--text-muted); margin: 0 8px;">Refunds</a>
    </div>
  </div>

  <script>
    (function(){
      var SUB_KEY = 'mos_subscription';
      var API = 'https://muscleos-access-control.muscleos.workers.dev/api/verify-code';
      
      var btn = document.getElementById('unlockBtn');
      var input = document.getElementById('accessCode');
      var err = document.getElementById('errorMsg');
      var staySignedInEl = document.getElementById('staySignedIn');

      var ERR_MSGS = {
        invalid_code: 'Wrong code. Please check and try again.',
        wrong_product: 'This code belongs to a different product.',
        code_used_by_other: 'This code is already linked to another account.',
        code_exhausted: 'This code has already been used.',
        code_revoked: 'This code has been revoked.',
        code_expired: 'This code has expired.',
        network: 'Network error. Please try again.'
      };

      function routeProduct(productId) {
        if (productId === 'omni_hub' || productId === 'all_access') {
          window.location.href = 'tools/muscle_os_app.html';
        } else if (productId === 'training_tool') {
          window.location.href = 'tools/training_tool.html';
        } else if (productId === 'tdee_adaptive_engine') {
          window.location.href = 'tools/tdee_adaptive_engine.html';
        } else {
          window.location.href = 'index.html';
        }
      }

      function storeData(key, value) {
        var stay = staySignedInEl ? staySignedInEl.checked : true;
        if (stay) {
          localStorage.setItem(key, value);
        } else {
          sessionStorage.setItem(key, value);
          localStorage.removeItem(key);
        }
      }

      function attemptVerify(code) {
        btn.disabled = true;
        btn.textContent = 'Verifying...';
        err.style.display = 'none';

        fetch(API, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ code: code, productId: 'any' }) 
        })
        .then(function(r){ return r.json().catch(function(){ return null; }).then(function(d){ return { ok: r.ok, d: d }; }); })
        .then(function(res){
          if (res.ok && res.d && res.d.valid) {
            var actualProdId = res.d.productId || 'all_access';
            storeData(SUB_KEY, JSON.stringify({ 
              active: true, 
              plan: res.d.plan || 'pro_tool', 
              expiry: (res.d.expiresAt || '').slice(0, 10), 
              token: res.d.token || '', 
              code: code, 
              email: '', 
              prodId: actualProdId 
            }));
            routeProduct(actualProdId);
          } else {
            btn.disabled = false;
            btn.textContent = 'UNLOCK ACCESS';
            err.style.display = 'block';
            if (res.d && res.d.error) {
              err.textContent = ERR_MSGS[res.d.error] || ERR_MSGS.invalid_code;
            } else {
              err.textContent = ERR_MSGS.network;
            }
          }
        })
        .catch(function(){ 
          btn.disabled = false;
          btn.textContent = 'UNLOCK ACCESS';
          err.style.display = 'block';
          err.textContent = ERR_MSGS.network; 
        });
      }

      btn.addEventListener('click', function(){
        var code = (input.value || '').trim();
        if(code) attemptVerify(code);
      });
      
      input.addEventListener('keypress', function(e){
        if(e.key === 'Enter') {
          var code = (input.value || '').trim();
          if(code) attemptVerify(code);
        }
      });

      // Google Sign-In Integration
      var GOOGLE_CLIENT_ID = '335156097845-vq52ttt74pak112mn2eet5j3s1k15fn9.apps.googleusercontent.com';
      var API_BASE = 'https://muscleos-access-control.muscleos.workers.dev';
      var OWNER_EMAIL = 'ANASSTEM2025@GMAIL.COM';

      function initGsi(){
        var host = document.getElementById('googleSignInBtn');
        if(!host) return;

        // Ensure google script has loaded before marking initialized
        if(typeof google === 'undefined' || !google.accounts || !google.accounts.id){
          setTimeout(initGsi, 200);
          return;
        }

        if(host.getAttribute('data-gsi')) return;
        host.setAttribute('data-gsi', '1');

        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: function(resp){
            if(!resp || !resp.credential){
              err.style.display = 'block';
              err.textContent = 'Google sign-in failed. Please try again.';
              return;
            }
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            fetch(API_BASE + '/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: resp.credential })
            }).then(function(r){ return r.json(); }).then(function(data){
              btn.disabled = false;
              btn.textContent = 'UNLOCK ACCESS';
              if(data && data.valid){
                storeData('mos_google_session', JSON.stringify({ session: data.session, email: data.email, name: data.name || '', ts: Date.now() }));
                var OWNER_EMAILS = ['ANASSTEM2025@GMAIL.COM', '1022066.ANAS@STEMEGYPT.EDU.EG', 'ANASSMOMEN@GMAIL.COM'];
                if(OWNER_EMAILS.includes(data.email.toUpperCase())){
                  storeData(SUB_KEY, JSON.stringify({
                    active: true, plan: 'master', expiry: '2099-12-31', code: 'OWNER', email: data.email, prodId: 'all_access', lifetime: true
                  }));
                  storeData('mos_book_training', JSON.stringify({ active: true, code: 'OWNER', book: 'training', expiry: '2099-12-31' }));
                  storeData('mos_book_nutrition', JSON.stringify({ active: true, code: 'OWNER', book: 'nutrition', expiry: '2099-12-31' }));
                  window.location.href = 'tools/muscle_os_app.html';
                  return;
                }
                if(data.subscriptions && data.subscriptions.length > 0){
                  var sub = data.subscriptions[0];
                  var prod = Array.isArray(sub.products) ? sub.products[0] : (sub.products || 'all_access');
                  storeData(SUB_KEY, JSON.stringify({
                    active: true, plan: sub.plan || 'pro_tool', expiry: (sub.expiresAt || '').slice(0, 10), code: sub.code || '', email: data.email, prodId: prod
                  }));
                  routeProduct(prod);
                  return;
                }
                window.location.href = 'tools/muscle_os_app.html';
              } else {
                err.style.display = 'block';
                err.textContent = 'Google sign-in failed. Please try again.';
              }
            }).catch(function(){
              btn.disabled = false;
              btn.textContent = 'UNLOCK ACCESS';
              err.style.display = 'block';
              err.textContent = 'Network error. Please try again.';
            });
          }
        });
        
        google.accounts.id.renderButton(host, { 
          theme: 'outline', 
          size: 'large', 
          width: 300,
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left'
        });
      }

      initGsi();
      
    })();
  </script>
</body>
</html>
