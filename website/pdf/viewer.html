<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Viewer — Muscle OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#14151A;color:#FAFAF8;min-height:100vh;display:flex;flex-direction:column}
/* Nav */
.mos-nav{position:sticky;top:0;z-index:999;background:rgba(20,21,26,.95);backdrop-filter:blur(8px);border-bottom:1px solid #2C2E37}
.mos-nav-inner{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
.mos-brand{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:#F4C93B;text-decoration:none;letter-spacing:1px;text-transform:uppercase}
.mos-brand span{font-weight:300;color:rgba(250,250,248,.35)}
.mos-nav-links{display:flex;gap:20px;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.mos-nav-links a{color:#C7C9D0;text-decoration:none;transition:color .2s}
.mos-nav-links a:hover{color:#F4C93B}
@media(max-width:600px){.mos-nav-links{gap:10px;font-size:9px}.mos-nav-inner{padding:8px 16px}.mos-brand{font-size:12px}}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:#1E1E2A;border-bottom:1px solid #2C2E37;flex-wrap:wrap;position:sticky;top:49px;z-index:99}
.toolbar button{background:transparent;border:1px solid #454854;color:#FAFAF8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px}
.toolbar button:hover{background:#F4C93B;color:#14151A;border-color:#F4C93B}
.toolbar button:disabled{opacity:.3;cursor:default;background:transparent;border-color:#454854;color:#FAFAF8}
.toolbar .page-info{font-size:13px;color:#C7C9D0;font-family:'Inter',sans-serif;min-width:100px;text-align:center}
.toolbar .zoom-info{font-size:12px;color:rgba(250,250,248,.45);min-width:50px;text-align:center;font-family:'Inter',sans-serif}
.toolbar .sep{width:1px;height:20px;background:#2C2E37}
.toolbar .filename{font-size:12px;color:rgba(250,250,248,.4);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}

/* Viewer */
#viewerContainer{flex:1;overflow:auto;background:#0E0F13;display:flex;flex-direction:column;align-items:center;padding:20px 0}
#viewer{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
#viewer .page{position:relative;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.6);margin-bottom:8px}
#viewer .page canvas{display:block;max-width:100%;height:auto!important}
#viewer .page .text-layer{position:absolute;inset:0;overflow:hidden;opacity:.2;pointer-events:none}
#viewer .page .text-layer span{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}

/* Loading / Error */
.loading{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:rgba(250,250,248,.35)}
.loading .spinner{width:32px;height:32px;border:3px solid #2C2E37;border-top-color:#F4C93B;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px}
.error-state{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:16px;padding:40px;text-align:center}
.error-state .icon{font-size:48px;opacity:.5}
.error-state h2{font-size:18px;color:#FAFAF8}
.error-state p{font-size:13px;color:rgba(250,250,248,.45);max-width:440px;line-height:1.6}
.error-state a{color:#F4C93B}

/* Loading overlay per page */
.page-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85)}
.page-loading .mini-spin{width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#14151A;border-radius:50%;animation:spin .8s linear infinite}

/* Footer */
.mos-footer{border-top:1px solid #2C2E37;padding:20px 24px;text-align:center;font-size:11px;color:rgba(250,250,248,.3)}
.mos-footer a{color:rgba(250,250,248,.5);text-decoration:none}
.mos-footer a:hover{color:#F4C93B}

@media(max-width:600px){.toolbar .filename{display:none}.toolbar{gap:6px;padding:8px 10px}.toolbar button{padding:5px 10px;font-size:11px}}
</style>
</head>
<body>

<nav class="mos-nav"><div class="mos-nav-inner"><a href="../index.html" class="mos-brand">ANAS MO'MEN <span>COACHING</span></a><div class="mos-nav-links"><a href="../index.html">Home</a><a href="../tools/">Tools</a><a href="../knowledge-hub/">Knowledge Hub</a><a href="../index.html#packages">Coaching</a></div></div></nav>

<div class="toolbar">
  <span class="filename" id="filename"></span>
  <button id="prevPage" disabled>&larr; Prev</button>
  <span class="page-info" id="pageInfo">- / -</span>
  <button id="nextPage" disabled>Next &rarr;</button>
  <div class="sep"></div>
  <button id="zoomOut">A-</button>
  <span class="zoom-info" id="zoomInfo">100%</span>
  <button id="zoomIn">A+</button>
  <div class="sep"></div>
  <a id="downloadBtn" style="color:#FAFAF8;text-decoration:none;font-size:12px;font-weight:500;padding:6px 14px;border:1px solid #454854;border-radius:6px;transition:all .2s;display:inline-flex;align-items:center;gap:5px" href="#" download>Download</a>
</div>

<div id="viewerContainer">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading PDF...</p>
  </div>
  <div id="viewer" style="display:none"></div>
  <div class="error-state" id="error" style="display:none">
    <div class="icon">&#128196;</div>
    <h2>Could not load PDF</h2>
    <p id="errorMsg">The file was not found or could not be opened.</p>
    <a href="../index.html">Back to Home</a>
  </div>
</div>

<footer class="mos-footer"><a href="https://muscleos.coach">muscleos.coach</a> — Coach Anas Mo'men</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const file = params.get('file');
if (!file) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errorMsg').textContent = 'No PDF file specified. Add ?file=path/to/document.pdf to the URL.';
}

const viewer = document.getElementById('viewer');
const loading = document.getElementById('loading');
const error = document.getElementById('error');
const errorMsg = document.getElementById('errorMsg');
const filename = document.getElementById('filename');
const pageInfo = document.getElementById('pageInfo');
const zoomInfo = document.getElementById('zoomInfo');
const prevBtn = document.getElementById('prevPage');
const nextBtn = document.getElementById('nextPage');
const zoomOutBtn = document.getElementById('zoomOut');
const zoomInBtn = document.getElementById('zoomIn');
const downloadBtn = document.getElementById('downloadBtn');

let pdfDoc = null, pageNum = 1, scale = 1.2, pageRendering = false, pageNumPending = null;

filename.textContent = file ? decodeURIComponent(file.split('/').pop() || file) : '';
downloadBtn.href = file || '#';

function renderPage(num) {
  pageRendering = true;
  pdfDoc.getPage(num).then(function(page) {
    const viewport = page.getViewport({ scale });
    const container = document.createElement('div');
    container.className = 'page';
    container.dataset.page = num;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    container.appendChild(canvas);

    // Loading indicator
    const loadDiv = document.createElement('div');
    loadDiv.className = 'page-loading';
    loadDiv.innerHTML = '<div class="mini-spin"></div>';
    container.appendChild(loadDiv);

    // Find position or append
    const existing = viewer.querySelectorAll('.page');
    let inserted = false;
    for (let i = 0; i < existing.length; i++) {
      if (parseInt(existing[i].dataset.page) > num) {
        viewer.insertBefore(container, existing[i]);
        inserted = true; break;
      }
    }
    if (!inserted) viewer.appendChild(container);

    const renderTask = page.render({ canvasContext: ctx, viewport });
    renderTask.promise.then(function() {
      container.querySelector('.page-loading')?.remove();
      pageRendering = false;
      if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
    });
  });
}

function queueRenderPage(num) {
  if (pageRendering) { pageNumPending = num; return; }
  renderPage(num);
}

function displayPage(num) {
  pageNum = num;
  // Show only visible pages around current
  const pages = viewer.querySelectorAll('.page');
  pages.forEach(function(p) {
    const n = parseInt(p.dataset.page);
    p.style.display = (n >= num - 2 && n <= num + 4) ? 'block' : 'none';
  });
  // Render nearby pages
  for (let i = Math.max(1, num - 1); i <= Math.min(pdfDoc.numPages, num + 3); i++) {
    if (!viewer.querySelector('.page[data-page="' + i + '"]')) queueRenderPage(i);
  }
  pageInfo.textContent = num + ' / ' + pdfDoc.numPages;
  prevBtn.disabled = num <= 1;
  nextBtn.disabled = num >= pdfDoc.numPages;
}

function onScroll() {
  const pages = viewer.querySelectorAll('.page');
  const container = document.getElementById('viewerContainer');
  const mid = container.scrollTop + container.clientHeight / 2;
  let closest = null, closestDist = Infinity;
  pages.forEach(function(p) {
    const offset = p.offsetTop - container.scrollTop;
    const dist = Math.abs(offset + p.offsetHeight / 2 - container.clientHeight / 2);
    if (dist < closestDist) { closestDist = dist; closest = p; }
  });
  if (closest) {
    const n = parseInt(closest.dataset.page);
    if (n !== pageNum) {
      pageNum = n;
      pageInfo.textContent = n + ' / ' + pdfDoc.numPages;
      prevBtn.disabled = n <= 1;
      nextBtn.disabled = n >= pdfDoc.numPages;
      displayPage(n);
    }
  }
}

prevBtn.addEventListener('click', function() { if (pageNum > 1) { pageNum--; displayPage(pageNum); document.getElementById('viewerContainer').scrollTo({top: viewer.querySelector('.page[data-page="' + pageNum + '"]')?.offsetTop - 20, behavior:'smooth'}); } });
nextBtn.addEventListener('click', function() { if (pageNum < pdfDoc.numPages) { pageNum++; displayPage(pageNum); document.getElementById('viewerContainer').scrollTo({top: viewer.querySelector('.page[data-page="' + pageNum + '"]')?.offsetTop - 20, behavior:'smooth'}); } });
zoomOutBtn.addEventListener('click', function() { scale = Math.max(0.4, scale - 0.2); zoomInfo.textContent = Math.round(scale * 100) + '%'; viewer.innerHTML = ''; pageNum = 1; displayPage(1); });
zoomInBtn.addEventListener('click', function() { scale = Math.min(3, scale + 0.2); zoomInfo.textContent = Math.round(scale * 100) + '%'; viewer.innerHTML = ''; pageNum = 1; displayPage(1); });

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (pageNum > 1) { pageNum--; displayPage(pageNum); } }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (pageNum < pdfDoc.numPages) { pageNum++; displayPage(pageNum); } }
  else if (e.key === '+' || e.key === '=') { zoomInBtn.click(); }
  else if (e.key === '-') { zoomOutBtn.click(); }
});

if (file) {
  pdfjsLib.getDocument(file).promise.then(function(pdf) {
    pdfDoc = pdf;
    loading.style.display = 'none';
    viewer.style.display = 'flex';
    displayPage(1);
    document.getElementById('viewerContainer').addEventListener('scroll', onScroll);
  }).catch(function(err) {
    loading.style.display = 'none';
    error.style.display = 'flex';
    errorMsg.textContent = err.message || 'Failed to load PDF. Check that the file path is correct.';
  });
}
</script>
</body>
</html>
