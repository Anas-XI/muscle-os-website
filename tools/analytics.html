<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuscleOS - Analytics & Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="../assets/css/mos-nav.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg: var(--mos-bg); --surface: var(--mos-surface); --surface2: var(--mos-card-elevated); --primary: var(--mos-accent); --primary-dim: var(--mos-accent-dim); --text: var(--mos-text); --text-muted: var(--mos-text-muted); --border: var(--mos-border); --danger: var(--mos-danger); --success: var(--mos-emerald); }
  body { margin:0; font-family:var(--mos-font-body); background:var(--bg); color:var(--text); padding-bottom:100px; padding-top: 10px; }
  .container { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--surface); border-radius: 14px; padding: 22px; border: 1px solid var(--border); }
  h2 { font-family: var(--mos-font-display); text-transform: uppercase; margin: 0 0 16px 0; font-size: 1.2rem; letter-spacing: 0.5px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chart-container { position: relative; height: 250px; width: 100%; }
  .status-pill { font-family: var(--mos-font-mono); font-size: 0.68rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .status-pill.live { border-color: rgba(16,185,129,0.4); color: var(--success); background: var(--mos-emerald-dim); }
  .empty-banner { background: linear-gradient(135deg, rgba(226,232,240,0.08), rgba(20,21,26,0.9)); border: 1px solid rgba(226,232,240,0.22); border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
  .empty-banner p { margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
  .empty-cta { background: linear-gradient(135deg, #FFFFFF, #CBD5E1); color: var(--mos-bg); padding: 10px 18px; min-height: 44px; border-radius: 8px; text-decoration: none; font-family: var(--mos-font-display); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; display: inline-flex; align-items: center; }
  
  /* Heatmap */
  .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .heat-node { border-radius: 8px; background: var(--surface2); padding: 12px 8px; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s; }
  .heat-node .name { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
  .heat-node .status { width: 12px; height: 12px; border-radius: 50%; background: #333; margin-top: 4px; }
  .heat-node.recovered .status { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.45); }
  .heat-node.sore .status { background: var(--primary); box-shadow: 0 0 8px rgba(226,232,240,0.45); }
  .heat-node.fatigued .status { background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,0.45); }
  
  .empty-state { text-align: center; padding: 36px 18px; color: var(--text-muted); font-size: 0.88rem; }
  
  /* KPI Row */
  .kpi-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .kpi-card { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .kpi-val { font-family: var(--mos-font-display); font-size: 1.8rem; color: var(--text); line-height: 1.2; }
  .kpi-lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-top: 4px; }
  .kpi-trend { font-size: 0.75rem; font-weight: 600; margin-top: 4px; }
  .trend-up { color: var(--success); }
  .trend-down { color: var(--danger); }
</style>
</head>
<body>
<nav class="mos-nav"></nav>
<div class="container">
  <div id="analyticsBanner"></div>

  <!-- KPIs -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card">
      <div class="kpi-val" id="kpiSessions">-</div>
      <div class="kpi-lbl">Sessions Logged</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiWeight">-</div>
      <div class="kpi-lbl">Current Weight</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpiTdee">-</div>
      <div class="kpi-lbl">Est. TDEE</div>
    </div>
  </div>

  <!-- Heatmap -->
  <div class="card">
    <h2>Muscle Recovery Heatmap</h2>
    <div id="heatmapGrid" class="heatmap-grid">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- Charts -->
  <div class="card">
    <h2>Training Focus &amp; Strength Radar <span class="status-pill" id="radarBadge">Synced Sets</span></h2>
    <div class="chart-container">
      <canvas id="radarChart"></canvas>
    </div>
  </div>
  <div class="card">
    <h2>Bodyweight &amp; TDEE Trend <span class="status-pill" id="weightBadge">Metabolic Engine</span></h2>
    <div class="chart-container" id="weightWrap">
      <canvas id="weightChart"></canvas>
    </div>
  </div>
  
  <div class="card">
    <h2>Volume Progression <span class="status-pill" id="volumeBadge">Total Sets / Wk</span></h2>
    <div class="chart-container" id="volumeWrap">
      <canvas id="volumeChart"></canvas>
    </div>
  </div>

</div>

<script>
  // --- Data Loading ---
  function ls(key, def) {
    try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : def; } 
    catch(e) { return def; }
  }

  // Common styles for Chart.js
  Chart.defaults.color = '#8B95A7';
  Chart.defaults.font.family = "'Inter', sans-serif";
  const gridColor = 'rgba(250,250,248,0.06)';

  function classifyMuscle(exName) {
    const n = String(exName || '').toLowerCase();
    if (n.includes('bench') || n.includes('pec') || n.includes('chest') || n.includes('fly') || n.includes('push')) return 'chest';
    if (n.includes('row') || n.includes('pull') || n.includes('lat') || n.includes('deadlift')) return 'back';
    if (n.includes('squat') || n.includes('leg press') || n.includes('quad') || (n.includes('extension') && !n.includes('tricep'))) return 'quads';
    if (n.includes('rdl') || n.includes('hamstring') || (n.includes('curl') && n.includes('leg'))) return 'hamstrings';
    if ((n.includes('press') && (n.includes('shoulder') || n.includes('overhead') || n.includes('ohp'))) || n.includes('lateral') || n.includes('delt')) return 'delts';
    if (n.includes('curl') && !n.includes('leg')) return 'biceps';
    if (n.includes('tricep') || n.includes('pushdown') || n.includes('skull')) return 'triceps';
    if (n.includes('calf')) return 'calves';
    return 'abs';
  }

  function initAnalytics() {
    const tdeeStore = ls('muscle_os_adaptive_tdee', {weights: []});
    const logs = ls('mos_logs', {});
    const datesAll = Object.keys(logs).sort();
    const sessionCount = datesAll.length;
    document.getElementById('kpiSessions').innerText = sessionCount;

    const bannerEl = document.getElementById('analyticsBanner');
    if (sessionCount === 0 && (!tdeeStore.weights || tdeeStore.weights.length === 0)) {
      bannerEl.innerHTML = `
        <div class="empty-banner">
          <div>
            <strong style="color:var(--primary); font-family:var(--mos-font-display); text-transform:uppercase; font-size:1rem;">No Workout or Weight Logs Found Yet</strong>
            <p>Start logging sets in the Training Tool or check-in weights in TDEE Engine to unlock live ACWR, volume, and strength radar telemetry.</p>
          </div>
          <a href="training_tool.html" class="empty-cta">Open Training Tool &rarr;</a>
        </div>
      `;
    }

    if (tdeeStore.weights && tdeeStore.weights.length > 0) {
      const lastW = tdeeStore.weights[tdeeStore.weights.length - 1];
      document.getElementById('kpiWeight').innerText = Number(lastW.weight).toFixed(1) + ' kg';
      const dashboard = tdeeStore.dashboard || {};
      if (dashboard.tdee) document.getElementById('kpiTdee').innerText = Math.round(dashboard.tdee) + ' kcal';
    }

    const muscles = ['chest', 'back', 'quads', 'hamstrings', 'delts', 'biceps', 'triceps', 'calves', 'abs'];
    const recentVolume = {};
    const exactSoreness = {};
    const allVolume = { chest: 0, back: 0, quads: 0, hamstrings: 0, delts: 0, biceps: 0, triceps: 0 };
    muscles.forEach(m => { recentVolume[m] = 0; exactSoreness[m] = 1; });

    const recentDates = new Set(datesAll.slice(-4));
    datesAll.forEach(d => {
      const session = logs[d] || {};
      const bf = session._biofeedback;
      const isRecent = recentDates.has(d);

      if (Array.isArray(session.exercises)) {
        session.exercises.forEach(ex => {
          const target = classifyMuscle(ex.name);
          const count = Array.isArray(ex.sets) ? ex.sets.length : 0;
          if (allVolume[target] !== undefined) allVolume[target] += count;
          if (isRecent) {
            recentVolume[target] += count;
            if (bf && bf.soreness > exactSoreness[target]) exactSoreness[target] = bf.soreness;
          }
        });
      } else {
        Object.keys(session).forEach(key => {
          if (key === '_biofeedback') return;
          const exData = session[key];
          if (!exData || !Array.isArray(exData.sets)) return;
          const target = classifyMuscle(key);
          const count = exData.sets.length;
          if (allVolume[target] !== undefined) allVolume[target] += count;
          if (isRecent) {
            recentVolume[target] += count;
            if (bf && bf.soreness > exactSoreness[target]) exactSoreness[target] = bf.soreness;
          }
        });
      }
    });

    const grid = document.getElementById('heatmapGrid');
    muscles.forEach(m => {
      const vol = recentVolume[m];
      const sore = exactSoreness[m];
      let statusClass = 'recovered';
      let statusText = sessionCount > 0 ? 'Recovered' : 'Ready';
      if (sore >= 4) { statusClass = 'fatigued'; statusText = 'Fatigued'; }
      else if (sore >= 3) { statusClass = 'sore'; statusText = 'Very Sore'; }
      else if (sore === 2 || vol > 0) { statusClass = 'sore'; statusText = 'Recovering'; }
      else if (vol > 15) { statusClass = 'fatigued'; statusText = 'High Volume'; }
      grid.innerHTML += `
        <div class="heat-node ${statusClass}">
          <div class="name">${m}</div>
          <div class="status"></div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px">${statusText}</div>
        </div>
      `;
    });

    const radarRaw = [
      allVolume.chest,
      allVolume.back,
      allVolume.quads,
      allVolume.hamstrings,
      allVolume.delts,
      allVolume.biceps + allVolume.triceps
    ];
    const maxAxis = Math.max(12, ...radarRaw);
    const hasRadarData = radarRaw.some(v => v > 0);
    const radarBadge = document.getElementById('radarBadge');
    if (radarBadge) {
      radarBadge.textContent = hasRadarData ? 'Live Telemetry' : 'No Sets Logged';
      if (hasRadarData) radarBadge.classList.add('live');
    }

    const ctxRadar = document.getElementById('radarChart').getContext('2d');
    new Chart(ctxRadar, {
      type: 'radar',
      data: {
        labels: ['Chest', 'Back', 'Quads', 'Hamstrings', 'Shoulders', 'Arms'],
        datasets: [{
          label: 'Normalized Volume Score',
          data: hasRadarData ? radarRaw.map(v => Math.round((v / maxAxis) * 100)) : [0, 0, 0, 0, 0, 0],
          backgroundColor: 'rgba(226,232,240,0.2)',
          borderColor: '#E2E8F0',
          pointBackgroundColor: '#E2E8F0',
          pointBorderColor: '#08090C',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          r: {
            angleLines: { color: gridColor },
            grid: { color: gridColor },
            pointLabels: { color: '#CBD5E1', font: { size: 11, family: 'Inter' } },
            ticks: { display: false, max: 100, min: 0 }
          }
        }
      }
    });

    if (tdeeStore.weights && tdeeStore.weights.length > 0) {
      const wb = document.getElementById('weightBadge');
      if (wb) wb.classList.add('live');
      const wData = tdeeStore.weights.slice(-30);
      const ctxWeight = document.getElementById('weightChart').getContext('2d');
      new Chart(ctxWeight, {
        type: 'line',
        data: {
          labels: wData.map(d => {
            const dt = new Date(d.date);
            return dt.getDate() + '/' + (dt.getMonth() + 1);
          }),
          datasets: [{
            label: 'Bodyweight (kg)',
            data: wData.map(d => d.weight),
            borderColor: '#E2E8F0',
            backgroundColor: 'rgba(226,232,240,0.1)',
            borderWidth: 2,
            pointRadius: 3,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: gridColor } },
            x: { grid: { display: false } }
          }
        }
      });
    } else {
      document.getElementById('weightWrap').innerHTML = '<div class="empty-state">Log at least 1 weigh-in inside <a href="tdee_adaptive_engine.html" style="color:var(--primary);text-decoration:underline;">TDEE Adaptive Engine</a> to plot your metabolic trend.</div>';
    }

    const volData = [];
    let currentWeekStr = '';
    let currentWeekVol = 0;

    datesAll.forEach(d => {
      const dt = new Date(d);
      const week = dt.getFullYear() + '-W' + Math.max(1, Math.ceil(dt.getDate() / 7));
      if (week !== currentWeekStr) {
        if (currentWeekStr) volData.push({ week: currentWeekStr, vol: currentWeekVol });
        currentWeekStr = week;
        currentWeekVol = 0;
      }
      const session = logs[d] || {};
      if (Array.isArray(session.exercises)) {
        session.exercises.forEach(ex => { currentWeekVol += Array.isArray(ex.sets) ? ex.sets.length : 0; });
      } else {
        Object.keys(session).forEach(key => {
          if (key === '_biofeedback') return;
          const exData = session[key];
          if (exData && Array.isArray(exData.sets)) currentWeekVol += exData.sets.length;
        });
      }
    });
    if (currentWeekStr && currentWeekVol > 0) volData.push({ week: currentWeekStr, vol: currentWeekVol });

    if (volData.length > 0) {
      const vb = document.getElementById('volumeBadge');
      if (vb) vb.classList.add('live');
      const ctxVol = document.getElementById('volumeChart').getContext('2d');
      new Chart(ctxVol, {
        type: 'bar',
        data: {
          labels: volData.slice(-10).map(d => d.week),
          datasets: [{
            label: 'Total Sets',
            data: volData.slice(-10).map(d => d.vol),
            backgroundColor: 'rgba(226,232,240,0.85)',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: gridColor }, beginAtZero: true },
            x: { grid: { display: false } }
          }
        }
      });
    } else {
      document.getElementById('volumeWrap').innerHTML = '<div class="empty-state">Complete a workout session in <a href="training_tool.html" style="color:var(--primary);text-decoration:underline;">Training Tool</a> to view weekly set volume.</div>';
    }
  }

  window.addEventListener('DOMContentLoaded', initAnalytics);
</script>
<script src="../assets/js/mos-nav.js"></script>
</body>
</html>
